[project]
name = "backend"
version = "0.2.0"
description = "FastAPI starter with authentication and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.53.0,<1",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "slowapi>=0.1.9,<0.2",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.20,<1",
]

[tool.uv]
package = false
